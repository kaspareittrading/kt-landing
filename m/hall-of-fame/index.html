<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hall of Fame | All Time High | Mitgliederbereich</title>
<link rel="stylesheet" href="../../schrift/schrift.css">
<!-- Quelle: outputs\hall-of-fame\hall-of-fame-vorlage.html. Nie von Hand in der fertigen Seite aendern,
     sondern hier, dann: python scripts\hall-of-fame-bauen.py test -->
<style>
:root{--red:#D6625A;--bg:#0a0f10;--bg2:#0d1314;--ink:#e7eced;--muted:#bac4c6;--dim:#8f999b;--teal:#40C6CC;--gold:#D8AE5E;--green:#33C46F;--yellow:#E3C454;--line:rgba(255,255,255,.08);--card:rgba(255,255,255,.025);--goldline:rgba(216,174,94,.28)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scrollbar-color:rgba(216,174,94,.45) var(--bg);scrollbar-width:thin}
::selection{background:rgba(216,174,94,.35);color:#fff}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:300;line-height:1.62;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 26px}
section{padding:72px 0;position:relative}
.kicker{font-size:12px;letter-spacing:.4em;text-transform:uppercase;font-weight:600;color:var(--gold);margin-bottom:18px}
h1,h2,h3,h4{font-weight:300;letter-spacing:.01em;line-height:1.12}
h2{font-size:clamp(28px,4vw,42px)}
p{color:var(--muted)}
.hg{color:var(--gold);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 26px;border-radius:40px;font-size:14px;letter-spacing:.04em;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:box-shadow .3s,transform .3s,border-color .3s;font-family:inherit}
.btn-gold{background:var(--gold);color:#1a1205}
.btn-gold:hover{box-shadow:0 0 28px rgba(216,174,94,.5);transform:translateY(-1px)}
.btn-ghost{border-color:var(--goldline);color:var(--ink);background:transparent}
.btn-ghost:hover{border-color:var(--gold);box-shadow:0 0 20px rgba(216,174,94,.22)}
.zurueck-oben{padding-top:22px}
.zurueck-unten{text-align:center;padding:8px 0 44px}
.btn.zurueck{padding:10px 20px;font-size:13px}
.btn small{font-weight:400;opacity:.75;letter-spacing:0}
.btn:focus-visible,.kopf:focus-visible,.chip:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

.testband{background:#3a2c0e;color:#f3dfb2;text-align:center;font-size:13px;padding:9px 16px;letter-spacing:.03em;border-bottom:1px solid var(--goldline)}

/* So pruefen wir */
.pruefung{padding:56px 0 64px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(212,168,67,.035),transparent 40%)}
.pr-kopf{max-width:760px}
.pr-knopf{margin-top:24px}
.pr-knopf svg{transition:transform .3s}
.pr-knopf[aria-expanded="true"] svg{transform:rotate(180deg)}
#prSchritte{margin-top:40px}
#prSchritte[hidden]{display:none}
.pr-unten{padding-top:34px;border-top:1px solid var(--line);margin-top:34px}
.pr-unten .pr-knopf{margin-top:0}
.pr-kern{font-size:clamp(17px,2vw,20px);color:var(--ink);margin-top:16px;line-height:1.55}
.pr-schritt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;padding:34px 0;border-top:1px solid var(--line)}
.pr-text p{font-size:15.5px;margin-top:10px}
.pr-text p b,.pr-zwei p b,.pr-liste b{color:var(--ink);font-weight:600}
.pr-nr{width:30px;height:30px;border-radius:50%;border:1px solid var(--goldline);color:#D4A843;font-size:13px;font-weight:600;display:grid;place-items:center;margin-bottom:12px}
.pruefung h3{font-size:21px;font-weight:400;color:var(--ink)}
.pr-liste{list-style:none;margin-top:10px}
.pr-liste li{font-size:15px;color:var(--muted);padding:5px 0 5px 16px;position:relative}
.pr-liste li:before{content:"";position:absolute;left:0;top:15px;width:7px;height:1px;background:#D4A843}
.pr-einfach{border:1px solid var(--goldline);border-radius:12px;padding:12px 16px;color:var(--ink)!important;background:rgba(212,168,67,.05)}
.pr-bild{margin:0;border:1px solid var(--line);border-radius:16px;padding:18px;background:rgba(0,0,0,.25)}
.pr-bild svg{display:block;width:100%;height:auto}
.sv-t{font:500 20px Manrope,Arial,sans-serif;fill:#bac4c6}
.sv-l{font:600 21px Manrope,Arial,sans-serif;fill:#e7eced}
.sv-k{font:400 18px Manrope,Arial,sans-serif;fill:#8f999b}
.sv-teal{fill:#40C6CC}
.sv-achse{stroke:rgba(255,255,255,.18);stroke-width:1}
.sv-tag circle{fill:rgba(212,168,67,.08);stroke:#D4A843;stroke-width:1.5}
.pr-zwei{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;padding-top:34px;border-top:1px solid var(--line)}
.pr-zwei p{font-size:15.5px;margin-top:10px}
.pr-klein{font-size:13.5px!important;color:var(--dim)!important;margin-top:12px!important}
.tab-huelle{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pr-tab{width:100%;border-collapse:collapse;font-size:14px}
.pr-tab th,.pr-tab td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;color:var(--muted)}
.pr-tab thead th{border-top:0;background:rgba(255,255,255,.03);color:var(--ink);font-weight:500}
.pr-tab td:first-child{color:var(--ink)}
.leiter{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.leiter>div{display:grid;grid-template-columns:110px 92px minmax(0,1fr);gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.l-kopf{border-top:0!important;background:rgba(255,255,255,.03);color:var(--ink)!important;font-size:12.5px!important}
.l-zeile span:first-child{color:var(--ink);display:flex;align-items:center;gap:8px}
.l-zeile i{font-style:normal;color:#D4A843;font-size:19px;font-family:'Segoe UI Symbol','DejaVu Sans','Noto Sans Symbols 2',serif;width:20px}
.l-zeile span:last-child{display:flex;align-items:center;gap:10px}
.l-zeile b{display:block;height:8px;border-radius:4px;background:#D4A843;width:calc(var(--w) * .7);opacity:.85}
.hero-knoepfe{display:flex;flex-wrap:wrap;gap:12px}
@media(max-width:820px){
  .pr-schritt,.pr-zwei{grid-template-columns:1fr;gap:22px}
  .pr-bild{padding:12px}
  .leiter>div{grid-template-columns:92px 64px minmax(0,1fr);padding:9px 10px;font-size:13.5px}
  .pr-tab{font-size:13px}.pr-tab th,.pr-tab td{padding:8px 8px}
}
/* Hero */
.marke{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:46px}
.marke-schrift{font-size:15px;font-weight:700;letter-spacing:.35em;color:#D4A843;margin:0 0 16px .35em}
.marke-logo{width:144px;height:144px;object-fit:contain;filter:brightness(1.15) drop-shadow(0 2px 12px rgba(212,168,67,.28))}
.marke h1{margin-top:18px}
.marke .plattform{margin-top:16px;font-size:22px;font-weight:300;color:#ECECEC;letter-spacing:.01em}
.marke .plattform span{color:var(--gold)}
.hero{padding:64px 0 56px;background:radial-gradient(ellipse 80% 60% at 50% 22%,#1a1408 0%,rgba(26,20,8,0) 70%)}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:44px;align-items:end}
.hero h1{font-size:clamp(44px,7.4vw,84px)}
.hero h1 span{color:var(--gold)}
.hero .sub{font-size:clamp(16.5px,1.9vw,19px);margin:22px 0 28px;max-width:600px}
.fakten{display:flex;gap:30px;flex-wrap:wrap;margin-bottom:30px}
.staerke{font-size:14.5px;max-width:600px;margin:-6px 0 26px;padding-left:0}
.staerke b{color:var(--ink);font-weight:600}
.fakt b{display:block;font-size:22px;font-weight:400;color:var(--ink)}
.fakt span{font-size:13px;color:var(--dim);letter-spacing:.03em}
.voraus{border:1px solid var(--goldline);border-radius:18px;padding:26px 26px 24px;background:linear-gradient(160deg,rgba(216,174,94,.10),rgba(255,255,255,.015))}
.voraus .titel{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}
.voraus p{font-size:15.5px;color:var(--ink)}
.voraus p+p{margin-top:10px;color:var(--muted);font-size:14.5px}
.tag-sp{display:inline-block;font-size:11px;letter-spacing:.06em;font-weight:600;color:var(--teal);border:1px solid rgba(64,198,204,.35);border-radius:20px;padding:1px 9px;white-space:nowrap;vertical-align:2px}

/* Legende */
.legende{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:18px}
.leg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px}
.leg h3{font-size:15px;font-weight:600;letter-spacing:.02em;margin-bottom:10px;color:var(--ink)}
.leg p,.leg li{font-size:14px;color:var(--muted)}
.leg ul{list-style:none;margin-top:8px}
.leg li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line)}
.leg li b{font-weight:500;color:var(--ink)}
.leg li .fz{font-family:'Segoe UI Symbol','DejaVu Sans','Noto Sans Symbols 2',serif;font-variant-emoji:text;color:var(--gold);font-size:17px;width:22px;display:inline-block}
.leg .klein{font-size:13px;color:var(--dim);margin-top:10px}
.kopfhinweis{border:1px solid var(--goldline);border-radius:14px;padding:16px 20px;margin-bottom:14px;background:rgba(216,174,94,.04)}
.kopfhinweis p{font-size:14.5px}
.kopfhinweis p+p{margin-top:8px}
.kopfhinweis b{color:var(--ink);font-weight:600}
.erklaerung{border:1px solid var(--line);border-radius:14px;margin-bottom:26px;background:var(--card)}
.erklaerung summary{cursor:pointer;padding:14px 18px;font-size:14.5px;color:var(--ink);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.erklaerung summary::-webkit-details-marker{display:none}
.erklaerung summary:after{content:"+";color:var(--gold);font-size:20px;line-height:1}
.erklaerung[open] summary:after{content:"\2212"}
.erklaerung summary:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:14px}
.erklaerung .legende{padding:4px 18px 18px}
.pruefliste{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.pruefliste summary{cursor:pointer;font-size:13.5px;color:var(--ink)}
.pruefliste summary:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.pruefliste ul{margin-top:6px}
.pruefliste li{display:block;font-size:13.5px;padding:4px 0}
.offen-gross{margin:0 0 18px}
.offen-gross p{color:#f3dfb2;font-size:13.5px;margin-top:6px}
.offen-gross ul{margin:8px 0 0 18px}
.offen-gross li{padding:3px 0}
.offen{border:1px dashed var(--goldline);border-radius:12px;padding:12px 14px;margin-top:18px;font-size:13.5px;color:#f3dfb2;background:rgba(216,174,94,.05)}

/* Werkzeugleiste */
.leiste{display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:space-between;margin-bottom:14px}
.gruppe{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gruppe .lbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-right:4px}
.chip{font-family:inherit;font-size:13.5px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:30px;padding:7px 15px;cursor:pointer;transition:border-color .2s,color .2s}
.chip:hover{border-color:var(--goldline);color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:rgba(216,174,94,.08)}
.chip .pf{color:var(--gold);margin-left:4px}
.bt-hinweis{font-size:12.5px;color:var(--dim);margin-bottom:12px}

/* Liste */
.kopfzeile,.kopf{display:grid;grid-template-columns:54px minmax(0,1fr) 92px 86px 92px 70px 118px 26px;gap:12px;align-items:center}
.kopfzeile{padding:0 18px 10px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);row-gap:6px}
.kopfzeile .bt-gruppe{grid-column:4 / span 4;text-align:center;letter-spacing:.08em;text-transform:none;font-size:12px;color:var(--gold);border-bottom:1px solid var(--goldline);padding-bottom:5px}
.hb{display:none}
.tag-iv{display:inline-block;font-size:11px;letter-spacing:.04em;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 9px;white-space:nowrap;vertical-align:2px}
.kopfzeile .r,.kopf .r{text-align:right}
.eintrag{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;transition:border-color .25s}
.eintrag:hover,.eintrag.auf{border-color:var(--goldline)}
.kopf{width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:16px 18px;cursor:pointer;border-radius:14px}
.platz{font-size:22px;font-weight:300;color:var(--gold);font-variant-numeric:tabular-nums}
.name{display:flex;align-items:center;gap:12px;min-width:0}
.fig{font-family:'Segoe UI Symbol','DejaVu Sans','Noto Sans Symbols 2',serif;font-variant-emoji:text;flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;border:1px solid var(--line);color:var(--dim)}
.fig.bestaetigt{color:var(--gold);border-color:var(--goldline);background:rgba(216,174,94,.08)}
.fig.profil,.fig.karenz{color:var(--muted);border-style:dashed}
.fig.ziel,.fig.keine{color:transparent}
.name .t{min-width:0}
.name b{display:block;font-size:17px;font-weight:500;color:var(--ink)}
.name small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--dim);line-height:1.4}
.label{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.05em;padding:3px 11px;border-radius:20px;justify-self:start}
.label.gruen{color:var(--green);background:rgba(51,196,111,.12);border:1px solid rgba(51,196,111,.35)}
.label.gelb{color:var(--yellow);background:rgba(227,196,84,.12);border:1px solid rgba(227,196,84,.45)}
.zahl{font-variant-numeric:tabular-nums;font-size:15.5px;color:var(--ink);text-align:right}
.zahl .m{display:none}
.pfeil{color:var(--dim);transition:transform .3s;display:grid;place-items:center}
.eintrag.auf .pfeil{transform:rotate(180deg);color:var(--gold)}

.detail{padding:4px 18px 24px;border-top:1px solid var(--line)}
.detail[hidden]{display:none}
.statuszeile{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13.5px;color:var(--muted);padding:16px 0 18px}
.statuszeile b{color:var(--ink);font-weight:500}
.bloecke{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.block{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:rgba(0,0,0,.18);min-width:0}
.block h4{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
.block ul{list-style:none}
.block li{font-size:14px;color:var(--muted);padding:3px 0 3px 14px;position:relative;overflow-wrap:anywhere}
.block li ul{margin-top:2px}
.block li li{font-size:13.5px}
.block li:before{content:"";position:absolute;left:0;top:12px;width:5px;height:1px;background:var(--goldline)}
code{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:12.5px;color:#cfe9ea;background:rgba(64,198,204,.08);border:1px solid rgba(64,198,204,.15);border-radius:5px;padding:1px 5px;overflow-wrap:anywhere}
.vhinweis{margin-top:14px;border:1px solid var(--goldline);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--muted)}
.laden{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:end;margin-top:18px;border:1px solid var(--goldline);border-radius:12px;padding:18px 20px;background:rgba(216,174,94,.04)}
.laden h4{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
.laden ol{padding-left:20px}
.laden li{font-size:14px;color:var(--muted);padding:3px 0}
.laden li b{color:var(--ink);font-weight:600}
.laden .vs{font-size:13px;color:var(--dim);margin-top:10px}

/* Gleicher Kern und durchgefallene Strategien (Auftrag Alex 18.11.2026) */
.kern{border-color:var(--gold);background:linear-gradient(160deg,rgba(216,174,94,.10),rgba(255,255,255,.015))}
.kern .kt{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px}
.kern a{color:var(--gold)}
.durch{padding:70px 0 20px;border-top:1px solid var(--line)}
.durch h2{font-size:clamp(28px,4vw,40px);font-weight:300;margin-bottom:10px}
.durch .einl{max-width:760px;color:var(--muted);font-size:15.5px}
.durch .einl+.einl{margin-top:10px}
.durch .einl a{color:var(--gold)}
.dz{display:flex;gap:30px;flex-wrap:wrap;margin:22px 0 26px}
.dz b{display:block;font-size:22px;font-weight:400;color:var(--ink)}
.dz span{font-size:13px;color:var(--dim)}
.dz .rz b{color:var(--red)}
.gruende{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:30px}
.grund{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card)}
.grund b{display:block;font-size:14.5px;font-weight:500;color:var(--ink);margin-bottom:4px}
.grund p{font-size:13.5px;color:var(--muted)}
.grund .n{font-size:12.5px;color:var(--dim);margin-top:6px}
.rgruppe summary{align-items:flex-start}
.rgruppe summary .gt{display:flex;flex-direction:column;gap:2px}
.rgruppe summary .gt small{font-size:13px;color:var(--dim)}
.rgruppe .ginnen{padding:0 18px 18px}
.rgruppe .gerkl{font-size:14px;color:var(--muted);margin-bottom:12px;max-width:820px}
.rtab{width:100%;border-collapse:collapse;font-size:13.5px}
.rtab th{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.rtab td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--muted)}
.rtab .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.rtab .pl{color:var(--dim);font-variant-numeric:tabular-nums}
.rtab td b{display:block;color:var(--ink);font-weight:500;font-size:14.5px}
.rtab td small{display:block;color:var(--dim);font-size:13px;line-height:1.45;margin-top:2px}
.rtab ul{list-style:none}
.rtab li{position:relative;padding:1px 0 1px 14px;color:#e2a39e}
.rtab li:before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:rgba(214,98,90,.7)}
.rtab .hw{color:var(--dim);font-size:12.5px;margin-top:4px}
/* Kontrast angehoben (Alex 18.11.2026: auf dem Handy schlecht lesbar), Ziel mind. 7:1 */
.durch{--hell:#C8CDD2}
.durch .einl,.grund p,.rgruppe .gerkl,.rtab td,.rtab td small,.rtab .hw,.rtab .pl,.grund .n,.dz span,.rgruppe summary .gt small,.rtab th{color:var(--hell)}
.rtab td small{font-size:13.5px}
.rtab .pl{font-size:15px}
.rtab th{font-weight:600}
.rtab li{color:#FF9C93}
.rtab li:before{background:#FF8A80}
.rtab .hw{font-style:italic}
@media(max-width:980px){.gruende{grid-template-columns:1fr 1fr}}
@media(max-width:700px){
  .gruende{grid-template-columns:1fr}
  .rtab thead{display:none}
  .rtab,.rtab tbody,.rtab tr,.rtab td{display:block;width:100%}
  .rtab tr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:rgba(0,0,0,.18)}
  .rtab td{border:0;padding:3px 0}
  .rtab .r{text-align:left;display:inline-block;width:auto;margin-right:16px}
  .rtab .r:before{content:attr(data-k) " ";color:var(--hell);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .rtab .pl{display:inline-block;width:auto;margin-right:10px}
}

.leer{padding:40px 0;text-align:center;color:var(--dim)}

/* Hinweis unten */
.pflicht{border-top:1px solid var(--line);padding:44px 0 60px}
.pflicht p{font-size:13.5px;color:var(--dim);max-width:900px}
.pflicht p+p{margin-top:10px}

@media(max-width:980px){
  .hero-grid{grid-template-columns:1fr;gap:30px}
  .legende{grid-template-columns:1fr}
}
@media(max-width:820px){
  section{padding:56px 0}
  .wrap{padding:0 16px}
  .kopfzeile{display:none}
  .kopf{grid-template-columns:40px minmax(0,1fr) 22px;grid-template-areas:"p n a" ". l l" ". z z";row-gap:10px;padding:14px 14px}
  .platz{grid-area:p;font-size:20px}
  .name{grid-area:n}
  .pfeil{grid-area:a}
  .label{grid-area:l}
  .zahlen-m{grid-area:z;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .hb{display:block;grid-column:1 / -1;font-size:11px;letter-spacing:.06em;color:var(--gold)}
  .zahl{text-align:left;font-size:14.5px}
  .zahl .m{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .detail{padding:4px 14px 20px}
  .bloecke{grid-template-columns:1fr}
  .laden{grid-template-columns:1fr}
}
@media(min-width:821px){.zahlen-m{display:contents}}
@media(max-width:420px){.zahlen-m{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script>
(function(){
  var DATEN=/*DATEN*/null;
  var liste=null;
  var nf1=new Intl.NumberFormat('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
  var nf3=new Intl.NumberFormat('de-DE',{minimumFractionDigits:3,maximumFractionDigits:3});
  var nf0=new Intl.NumberFormat('de-DE');
  var STANDARD={platz:1,pa:-1,calmar:-1,rendite:-1,rueckgang:1};
  var sortKey='platz', sortDir=1, filter='alle', eintraege=[];

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  /* Kleiner Markdown-Leser: Listen mit Unterpunkten (zwei Leerzeichen je Ebene), nummerierte Listen, Absaetze */
  function md(t){
    var out='',stapel=[];
    function zu(bis){while(stapel.length>bis){out+='</li></'+stapel.pop()+'>';}}
    String(t||'').split('\n').forEach(function(z){
      var m=z.match(/^(\s*)(-|\d+\.)\s+(.*)$/);
      if(m){
        var ebene=Math.floor(m[1].length/2)+1, typ=m[2]==='-'?'ul':'ol';
        if(ebene>stapel.length){while(stapel.length<ebene){out+='<'+typ+'>';stapel.push(typ);}}
        else{zu(ebene);out+='</li>';}
        out+='<li>'+inline(m[3]);
      }else if(z.trim()){zu(0);out+='<p>'+inline(z)+'</p>';}
    });
    zu(0);
    return out;
  }
  function figurText(f){
    if(f.stand==='bestaetigt')return f.name+', bestätigt';
    if(f.stand==='profil')return 'Profil '+f.name+' erfüllt, nicht alle Prüfungen streng bestanden';
    if(f.stand==='karenz')return 'Profil '+f.name+' mit Toleranz erfüllt';
    if(f.stand==='ziel')return 'Zielprofil '+f.name+', nicht bestätigt';
    return 'keine Figur, kein Profil erfüllt';
  }
  function sichererLink(u){return /^(https:\/\/|file:\/\/\/)/.test(u||'');}

  function baue(e,i){
    var a=document.createElement('article');
    a.className='eintrag';a.dataset.idx=i;
    var id='d'+e.platz, f=e.figur||{};
    var mitFigur=(f.stand==='bestaetigt'||f.stand==='profil'||f.stand==='karenz');
    var zeichen=mitFigur?f.zeichen+'︎':'';
    var bl=Object.keys(e.einstellungen||{}).map(function(k){return '<div class="block"><h4>'+esc(k)+'</h4>'+md(e.einstellungen[k])+'</div>';}).join('');
    var dl=sichererLink(e.zip)?'<a class="btn btn-gold" href="'+esc(e.zip)+'" download>Vorlage herunterladen <small>ZIP, '+esc(e.zipGroesse)+'</small></a>':(e.datei?'<button type="button" class="btn btn-gold" data-datei="'+esc(e.datei)+'">Vorlage herunterladen <small>ZIP, '+esc(e.zipGroesse)+'</small></button>':'<span class="bt-hinweis">Download nach Anmeldung</span>');
    a.innerHTML=
      '<button class="kopf" aria-expanded="false" aria-controls="'+id+'">'+
        '<span class="platz">'+e.platz+'</span>'+
        '<span class="name"><span class="fig '+esc(f.stand||'keine')+'" title="'+(mitFigur?esc(figurText(f)):'')+'" aria-hidden="true">'+zeichen+'</span>'+
          '<span class="t"><b>'+esc(e.name)+(e.spezial?' <span class="tag-sp">Kaspareit Spezial</span>':'')+(e.invest>100?' <span class="tag-iv" title="Kein Hebel: nur Obergrenze, investiert wird höchstens das vorhandene Kapital">Obergrenze '+e.invest+' %, kein Hebel</span>':'')+'</b><small>'+esc(e.beschreibung)+'</small></span></span>'+
        '<span class="label '+(e.bewertung==='Grün'?'gruen':'gelb')+'">'+esc(e.bewertung)+'</span>'+
        '<span class="zahlen-m"><span class="hb">Hypothetischer Backtest 2010 bis 16.10.2026</span>'+
          '<span class="zahl" data-k="pa"><span class="m">Pro Jahr</span>'+nf1.format(e.pa)+' %</span>'+
          '<span class="zahl" data-k="rueckgang"><span class="m">Rückgang</span>'+nf1.format(e.rueckgang)+' %</span>'+
          '<span class="zahl" data-k="calmar"><span class="m">Calmar</span>'+nf3.format(e.calmar)+'</span>'+
          '<span class="zahl" data-k="rendite"><span class="m">Gesamt</span>+'+nf1.format(e.rendite)+' %</span>'+
        '</span>'+
        '<span class="pfeil" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'+
      '</button>'+
      '<div class="detail" id="'+id+'" hidden>'+
        '<div class="statuszeile">'+(mitFigur?'<span>Figur: <b>'+esc(figurText(f))+'</b></span>':'')+'<span>Trades: <b>'+nf0.format(e.trades)+'</b></span><span>Zeitraum: <b>'+esc(e.zeitraum)+'</b>, hypothetischer Backtest</span></div>'+
        '<div class="bloecke">'+bl+'</div>'+
        (e.hinweis?'<p class="vhinweis"><b class="hg">Hinweis:</b> '+esc(e.hinweis)+'.</p>':'')+
        (e.zusatz?'<p class="vhinweis">'+esc(e.zusatz)+'</p>':'')+
        (e.invest>100?'<p class="vhinweis"><b class="hg">Investitionsgrad '+e.invest+' %:</b> Obergrenze, kein Hebel. Ohne „Hebel zulassen“ investiert die Plattform höchstens das vorhandene Kapital; es wurde ohne Kredit gerechnet.</p>':'')+
        '<div class="laden"><div><h4>So lädst du die Vorlage</h4>'+md(e.laden)+'<p class="vs">'+esc(e.voraussetzung)+'</p></div><div>'+dl+'</div></div>'+
      '</div>';
    a.querySelector('.kopf').addEventListener('click',function(){
      var d=a.querySelector('.detail'),auf=d.hidden;
      d.hidden=!auf;a.classList.toggle('auf',auf);this.setAttribute('aria-expanded',String(auf));hoehe();
    });
    return a;
  }

  function ordne(){
    var sorted=eintraege.slice().sort(function(x,y){var a=x.e[sortKey],b=y.e[sortKey];return a===b?x.e.platz-y.e.platz:(a<b?-1:1)*sortDir;});
    var n=0;
    sorted.forEach(function(o){var zeigen=filter==='alle'||o.e.bewertung===filter;o.el.hidden=!zeigen;if(zeigen)n++;liste.appendChild(o.el);});
    var leer=document.getElementById('keine');
    if(!n){if(!leer){leer=document.createElement('p');leer.id='keine';leer.className='leer';leer.textContent='Keine Vorlage passt zu diesem Filter.';liste.appendChild(leer);}}
    else if(leer)leer.remove();
    document.querySelectorAll('[data-sort]').forEach(function(b){var an=b.dataset.sort===sortKey;b.setAttribute('aria-pressed',String(an));b.querySelector('.pf').textContent=an?(sortDir===1?' ↑':' ↓'):'';});
    hoehe();
  }

  function zeige(p){
    var lade=document.getElementById('lade');if(lade)lade.remove();
    eintraege=(p.eintraege||[]).map(function(e,i){return {e:e,el:baue(e,i)};});
    document.getElementById('fAnzahl').textContent=eintraege.length;
    document.getElementById('fGruen').textContent=eintraege.filter(function(o){return o.e.bewertung==='Grün';}).length;
    document.getElementById('anzSpezial').textContent=eintraege.filter(function(o){return o.e.spezial;}).length+' der '+eintraege.length;
    var alle=document.getElementById('alleLaden');
    if(sichererLink(p.komplett)){alle.href=p.komplett;alle.hidden=false;document.getElementById('alleGroesse').textContent='ZIP, '+p.komplettGroesse;}
    else if(p.komplettDatei){alle.removeAttribute('download');alle.href='#';alle.dataset.datei=p.komplettDatei;alle.hidden=false;document.getElementById('alleGroesse').textContent='ZIP, '+p.komplettGroesse;}
    ordne();
  }

  /* Start: Inhalt einsetzen (nur Huelle), Knoepfe verbinden, Liste aufbauen */
  function starte(p){
    var ziel=document.getElementById('inhalt');
    if(p.seite&&!document.getElementById('eintraege')){ziel.innerHTML=p.seite;}
    liste=document.getElementById('eintraege');
    document.querySelectorAll('[data-sort]').forEach(function(b){b.addEventListener('click',function(){
      var k=b.dataset.sort; if(k===sortKey){sortDir=-sortDir;}else{sortKey=k;sortDir=STANDARD[k];} ordne();});});
    document.querySelectorAll('[data-filter]').forEach(function(b){b.addEventListener('click',function(){
      filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});ordne();});});
    bindePruefung();
    zeige(p);
  }

  /* Downloads in der Huelle: kein Dateilink in der Seite. Die Wix-Seite prueft die Rolle erneut und
     startet den Download ueber einen Link, der nach 10 Minuten verfaellt. */
  document.addEventListener('click',function(ev){
    var k=ev.target.closest&&ev.target.closest('[data-datei]');
    if(!k)return;
    ev.preventDefault();
    if(k.dataset.laeuft)return;
    k.dataset.laeuft='1';
    var alt=k.innerHTML;
    k.textContent='Download wird vorbereitet …';
    an({typ:'download',datei:k.dataset.datei});
    setTimeout(function(){k.innerHTML=alt;delete k.dataset.laeuft;},4000);
  });

  /* Verbindung zu Wix (Weg B), nur ohne eingebettete Daten: Eintraege und Download-Adressen liefert Wix nach Login und Rollenpruefung. */
  var ERLAUBT=/^https:\/\/(www\.)?kaspareit-trading\.com$|^https:\/\/[a-z0-9-]+\.(filesusr|wixsite|wix)\.com$|^https:\/\/[a-z0-9-]+\.wixstudio\.com$|^https:\/\/[a-z0-9-]+\.editor\.wix\.com$/;
  function an(n){try{if(window.parent!==window)window.parent.postMessage(n,'*');}catch(e){}}
  function hoehe(){an({typ:'hoehe',px:document.documentElement.scrollHeight});}
  if(DATEN){starte(DATEN);}
  else{
    var fertig=false;
    window.addEventListener('message',function(ev){
      if(!ERLAUBT.test(ev.origin))return;
      var d=ev.data||{};
      if(d.typ==='inhalt'&&d.hof){if(!fertig){fertig=true;starte(d.hof);}}
      else if(d.typ==='download-fehler'){var b=document.querySelector('[data-datei="'+String(d.datei||'').replace(/[^a-z0-9_-]/gi,'')+'"]');if(b){b.textContent='Download gerade nicht möglich, bitte Seite neu laden';}}
      else if(fertig){return;}
      else if(d.typ==='inhalt'){fertig=true;document.getElementById('lade').textContent='Die Hall of Fame ist Teil von All Time High. Mit deinem aktuellen Paket ist sie noch nicht freigeschaltet.';}
      else if(d.typ==='gast'){fertig=true;document.getElementById('lade').textContent='Bitte melde dich im Mitgliederbereich an.';}
      else if(d.typ==='fehler'){fertig=true;document.getElementById('lade').textContent='Dein Zugang konnte gerade nicht geprüft werden. Bitte lade die Seite neu.';}
    });
    an({typ:'bereit',bereich:'hall-of-fame'});
    setTimeout(function(){if(!fertig){document.getElementById('lade').textContent='Keine Verbindung zum Mitgliederbereich. Diese Seite funktioniert nur eingeloggt auf kaspareit-trading.com.';}},7000);
  }
  if(window.ResizeObserver)new ResizeObserver(hoehe).observe(document.body);

  /* So pruefen wir: auf- und zuklappen */
  function bindePruefung(){
    var box=document.getElementById('prSchritte'),sek=document.getElementById('pruefung');
    if(!box)return;
    var knoepfe=[].slice.call(document.querySelectorAll('.pr-knopf'));
    var oben=knoepfe[0];
    function setze(auf){
      box.hidden=!auf;
      oben.setAttribute('aria-expanded',String(auf));
      oben.querySelector('.pr-k-text').textContent=auf?'Prüfschritte ausblenden':'Alle neun Prüfschritte anzeigen';
      if(typeof hoehe==='function')hoehe();
    }
    oben.addEventListener('click',function(){setze(box.hidden);});
    knoepfe.slice(1).forEach(function(k){k.addEventListener('click',function(){setze(false);sek.scrollIntoView({block:'start'});oben.focus({preventScroll:true});});});
    document.querySelectorAll('[data-pruefung-auf]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();setze(true);sek.scrollIntoView({block:'start'});oben.focus({preventScroll:true});});});
    if(location.hash==='#pruefung')setze(true);
  }
})();
</script>
