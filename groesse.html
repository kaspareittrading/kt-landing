<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groessenmessung</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0f10;color:#e7eced;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:200}
  .rahmen{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:28px;padding:20px;text-align:center;
    border:3px dashed #40C6CC}
  .titel{font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:#40C6CC}
  .zahl{font-size:clamp(38px,9vw,104px);font-weight:200;line-height:1;white-space:nowrap}
  .zahl b{font-weight:400;color:#40C6CC}
  .zeile{font-size:clamp(13px,2.4vw,19px);color:#9fb0b2;max-width:620px;line-height:1.7}
  .marke{position:fixed;left:10px;top:10px;font-size:12px;color:#40C6CC;letter-spacing:.2em}
  .marke2{position:fixed;right:10px;bottom:10px;font-size:12px;color:#40C6CC;letter-spacing:.2em}
</style>
</head>
<body>
<div class="rahmen">
  <div class="marke">OBEN LINKS</div>
  <div class="marke2">UNTEN RECHTS</div>
  <div class="titel">So gross ist der Bereich, in dem ich laufe</div>
  <div class="zahl"><span id="b">?</span> breit &nbsp;<b>&times;</b>&nbsp; <span id="h">?</span> hoch</div>
  <div class="zeile" id="hinweis"></div>
  <div class="zeile" id="extra"></div>
</div>
<script>
(function(){
  function zeigen(){
    var b=window.innerWidth, h=window.innerHeight;
    document.getElementById('b').textContent=b;
    document.getElementById('h').textContent=h;

    /* Laeuft die Seite in einem Rahmen auf einer anderen Seite, oder direkt? */
    var imRahmen=false;
    try{ imRahmen = (window.self !== window.top); }catch(e){ imRahmen = true; }

    document.getElementById('hinweis').innerHTML = imRahmen
      ? 'Ich laufe <b style="color:#D8AE5E">in einem Kasten auf einer anderen Seite</b>. '
        + 'Die Zahlen oben sind also die echte Groesse dieses Kastens.'
      : 'Ich laufe <b style="color:#33C46F">direkt im Browserfenster</b>. '
        + 'Die Zahl fuer die Hoehe ist der Wert, den der Kasten haben muesste.';

    document.getElementById('extra').textContent =
      'Bildschirm insgesamt: ' + screen.width + ' x ' + screen.height
      + '   |   Vergroesserungsfaktor: ' + (window.devicePixelRatio || 1);
  }
  zeigen();
  window.addEventListener('resize', zeigen);
})();
</script>
</body>
</html>
